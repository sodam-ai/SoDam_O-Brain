<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>O-Brain · 내 기억 대시보드</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234D7CFE'/><text x='16' y='23' font-size='19' fill='white' text-anchor='middle' font-family='sans-serif' font-weight='bold'>O</text></svg>" />
<script>
  // 테마 선적용(깜빡임 방지)
  try { var _t = localStorage.getItem('obrain-theme'); if (_t) document.documentElement.dataset.theme = _t; } catch (e) {}
</script>
<style>
  :root {
    --bg:#0A0C10; --bg2:#0D1015; --surface:#13161D; --surface2:#191D26;
    --border:#21262F; --border2:#2D3340; --text:#EAEEF5; --muted:#8E97A6; --faint:#69727F;
    --accent:#5B8CFF; --accent2:#7B6BFF; --accent-weak:rgba(91,140,255,.14); --star:#F0B046;
    --ok:#2DD4A7; --danger:#F2555A;
    --r:11px; --r-sm:8px; --r-lg:16px;
    --fs-xs:11px; --fs-sm:12.5px; --fs-md:14px; --fs-lg:16px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 16px 48px -12px rgba(0,0,0,.6), 0 4px 12px rgba(0,0,0,.32), 0 0 0 1px rgba(255,255,255,.03) inset;
    --grad-accent:linear-gradient(135deg,var(--accent),var(--accent2));
    --ease:.18s cubic-bezier(.4,0,.2,1);
    --ease-spring:.42s cubic-bezier(.34,1.4,.64,1);
  }
  :root[data-theme="light"] {
    --bg:#EBEEF4; --bg2:#FFFFFF; --surface:#FFFFFF; --surface2:#F3F6FA;
    --border:#E4E9F1; --border2:#D2DAE5; --text:#0E1726; --muted:#4A5568; --faint:#7A8699;
    --accent:#3A6BF5; --accent2:#6D5BF0; --accent-weak:rgba(58,107,245,.09); --star:#D9942A;
    --shadow-sm:0 1px 2px rgba(15,23,42,.08);
    --shadow:0 16px 44px -14px rgba(15,23,42,.22), 0 4px 12px rgba(15,23,42,.08), 0 0 0 1px rgba(15,23,42,.04) inset;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.55 -apple-system,'Segoe UI',system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    letter-spacing:.1px; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    transition:background var(--ease), color var(--ease); }
  body { display:flex; flex-direction:column; height:100vh; overflow:hidden;
    background:
      radial-gradient(900px 520px at 82% -8%, rgba(123,107,255,.10), transparent 60%),
      radial-gradient(760px 460px at 8% 4%, rgba(91,140,255,.09), transparent 58%),
      var(--bg); }
  :root[data-theme="light"] body { background:
      radial-gradient(900px 520px at 82% -8%, rgba(109,91,240,.07), transparent 60%),
      radial-gradient(760px 460px at 8% 4%, rgba(58,107,245,.06), transparent 58%),
      var(--bg); }
  ::selection { background:rgba(77,124,254,.32); }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:8px; border:2px solid var(--bg); }
  button, select, input { font-family:inherit; }
  :focus { outline:none; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }

  /* ── 헤더 ── */
  header { display:flex; align-items:center; gap:12px; padding:11px 18px;
    border-bottom:1px solid var(--border); background:color-mix(in srgb, var(--bg2) 78%, transparent);
    backdrop-filter:saturate(1.3) blur(14px); -webkit-backdrop-filter:saturate(1.3) blur(14px);
    flex:none; position:relative; z-index:30; }
  .logo { width:27px; height:27px; border-radius:9px; flex:none;
    background:linear-gradient(135deg,#5B8CFF,#7B6BFF 58%,#2DD4A7);
    box-shadow:0 0 0 1px rgba(255,255,255,.10), 0 4px 16px rgba(91,140,255,.45);
    display:grid; place-items:center; color:#fff; font-weight:800; font-size:15px; }
  .brand { font-weight:700; font-size:15px; letter-spacing:.2px; }
  .brand small { color:var(--muted); font-weight:500; font-size:12px; margin-left:6px; }
  .search { position:relative; flex:1; max-width:440px; margin-left:8px; }
  .search > svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--faint); pointer-events:none; }
  .search input { width:100%; background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:var(--r); padding:9px 32px 9px 34px; font-size:13.5px; transition:border-color var(--ease), box-shadow var(--ease); }
  .search input::placeholder { color:var(--faint); }
  .search input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak); }
  .search .clear { position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none;
    color:var(--faint); cursor:pointer; padding:5px; border-radius:6px; display:none; line-height:0; }
  .search .clear:hover { color:var(--text); background:var(--surface2); }
  .search.has .clear { display:block; }
  .search .kbd { position:absolute; right:8px; top:50%; transform:translateY(-50%); font:600 11px/1 inherit; color:var(--faint);
    border:1px solid var(--border2); border-bottom-width:2px; border-radius:5px; padding:3px 7px; background:var(--surface2); pointer-events:none; }
  .search.has .kbd { display:none; }

  .htools { display:flex; align-items:center; gap:8px; margin-left:auto; }
  .icontop { background:var(--surface); border:1px solid var(--border); color:var(--muted); width:36px; height:36px;
    border-radius:var(--r); cursor:pointer; display:grid; place-items:center; line-height:0; transition:all var(--ease); position:relative; }
  .icontop:hover { color:var(--text); border-color:var(--border2); }
  .icontop svg { width:17px; height:17px; }
  .segmented { display:flex; gap:2px; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:3px; }
  .segmented button { display:flex; align-items:center; gap:6px; background:none; border:none; color:var(--muted);
    border-radius:7px; padding:6px 12px; cursor:pointer; font-size:12.5px; font-weight:500; transition:color var(--ease), background var(--ease); }
  .segmented button:hover { color:var(--text); }
  .segmented button.on { background:var(--grad-accent); color:#fff; box-shadow:0 4px 14px -2px rgba(91,140,255,.5); }
  .segmented svg { width:15px; height:15px; }

  /* 내보내기 메뉴 */
  .menu { position:absolute; top:42px; right:0; z-index:40; background:var(--surface); border:1px solid var(--border2);
    border-radius:var(--r); box-shadow:var(--shadow); padding:5px; min-width:150px; display:none; }
  .menu.open { display:block; }
  .menu button { display:flex; align-items:center; gap:9px; width:100%; background:none; border:none; color:var(--text);
    padding:8px 11px; border-radius:7px; cursor:pointer; font-size:13px; text-align:left; }
  .menu button:hover { background:var(--surface2); }

  /* ── 서브바(통계 + 필터 + 정렬) ── */
  .subbar { display:flex; align-items:center; gap:8px; padding:9px 18px; border-bottom:1px solid var(--border);
    background:color-mix(in srgb, var(--bg2) 70%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    flex:none; overflow-x:auto; scrollbar-width:none; position:relative; z-index:20; }
  .subbar::-webkit-scrollbar { display:none; }
  .chip { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; background:var(--surface);
    border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:5px 11px; cursor:pointer;
    font-size:12px; font-weight:500; transition:all var(--ease); }
  .chip:hover { border-color:var(--border2); color:var(--text); }
  .chip.on { background:var(--accent-weak); border-color:var(--accent); color:var(--accent); }
  .chip.all.on { background:var(--surface2); border-color:var(--border2); color:var(--text); font-weight:600; }
  .chip .cdot { width:7px; height:7px; border-radius:50%; }
  .chip .cnt { color:var(--faint); font-size:11px; font-variant-numeric:tabular-nums; }
  .countinfo { margin-left:auto; color:var(--faint); font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums; padding-left:10px; }
  .sortsel { background:var(--surface); border:1px solid var(--border); color:var(--muted); border-radius:999px;
    padding:5px 9px; font-size:12px; cursor:pointer; transition:all var(--ease); }
  .sortsel:hover { color:var(--text); border-color:var(--border2); }

  main { flex:1; position:relative; overflow:hidden; }
  section.view { position:absolute; inset:0; overflow:auto; padding:16px 18px 28px; }
  section.view[hidden] { display:none; }

  /* ── 목록(카드형) ── */
  .list { max-width:880px; margin:0 auto; display:flex; flex-direction:column; gap:9px; }
  .row { position:relative; display:flex; gap:13px; align-items:flex-start; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r); padding:14px 16px; cursor:pointer; overflow:hidden;
    transition:border-color var(--ease), background var(--ease), transform var(--ease), box-shadow var(--ease);
    animation:cardIn .42s cubic-bezier(.22,1,.36,1) both; }
  .row::before { content:''; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent);
    transform:scaleY(0); transform-origin:50% 50%; transition:transform var(--ease); border-radius:0 3px 3px 0; }
  .row:hover { background:var(--surface2); border-color:var(--border2); transform:translateY(-2px); box-shadow:0 8px 24px -6px rgba(0,0,0,.28); }
  .row:hover::before { transform:scaleY(.62); }
  .row:focus-visible { outline:2px solid var(--accent); outline-offset:-1px; }
  .list .row:nth-child(1){animation-delay:.02s} .list .row:nth-child(2){animation-delay:.05s}
  .list .row:nth-child(3){animation-delay:.08s} .list .row:nth-child(4){animation-delay:.11s}
  .list .row:nth-child(5){animation-delay:.14s} .list .row:nth-child(6){animation-delay:.17s}
  .list .row:nth-child(7){animation-delay:.2s} .list .row:nth-child(8){animation-delay:.23s}
  @keyframes cardIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  /* 스켈레톤 로딩 */
  .skel { display:flex; flex-direction:column; gap:9px; max-width:880px; margin:0 auto; }
  .skrow { display:flex; gap:13px; align-items:flex-start; background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:14px 16px; }
  .skb { background:linear-gradient(90deg,var(--surface2) 25%,var(--border) 37%,var(--surface2) 63%); background-size:400% 100%;
    animation:shimmer 1.4s ease infinite; border-radius:6px; height:12px; }
  @keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }
  .pill { flex:none; display:inline-flex; align-items:center; justify-content:center; gap:5px; min-width:48px; font-size:11px; font-weight:600; border-radius:7px; padding:3px 9px; line-height:1.5; color:var(--text); }
  .pill .pdot { width:7px; height:7px; border-radius:50%; flex:none; }
  .rc { flex:1; min-width:0; }
  .rtext { color:var(--text); font-size:14px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .rmeta { display:flex; align-items:center; gap:8px; margin-top:7px; color:var(--faint); font-size:11px; }
  .idots { display:inline-flex; gap:3px; }
  .idot { width:5px; height:5px; border-radius:50%; background:var(--border2); }
  .idot.on { background:var(--star); }
  .rtime { font-variant-numeric:tabular-nums; }
  .src { margin-left:auto; color:var(--faint); font-size:10px; opacity:.85; }

  /* ── 그래프 ── */
  #graphHost { position:absolute; inset:0; background:radial-gradient(circle at 50% 38%, #11161f 0%, #0B0D11 70%); }
  .gpanel { position:absolute; z-index:5; background:rgba(15,18,24,.74); backdrop-filter:blur(8px); border:1px solid #232a33; border-radius:var(--r); }
  .gbar { top:14px; left:14px; display:flex; gap:6px; align-items:center; padding:5px; }
  .gbtn { background:none; border:none; color:#8B93A3; border-radius:7px; padding:6px 12px; cursor:pointer; font-size:12.5px; font-weight:500; transition:all var(--ease); }
  .gbtn:hover { color:#E7EBF2; }
  .gbtn.on { background:var(--grad-accent); color:#fff; box-shadow:0 3px 12px -2px rgba(91,140,255,.5); }
  .gcount { color:#8B93A3; font-size:11.5px; margin:0 8px; }
  .legend { top:14px; right:18px; display:flex; flex-wrap:wrap; gap:6px 13px; justify-content:flex-end; padding:9px 13px; font-size:11px; color:#8B93A3; max-width:60vw; pointer-events:none; }
  .legend span { display:inline-flex; align-items:center; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; }
  .gzoom { bottom:14px; right:18px; display:flex; flex-direction:column; padding:4px; gap:2px; }
  .gzoom button { width:32px; height:32px; background:none; border:none; color:#aeb6c4; border-radius:7px; cursor:pointer; font-size:16px; line-height:1; display:grid; place-items:center; }
  .gzoom button:hover { background:rgba(255,255,255,.07); color:#fff; }
  .ghint { bottom:14px; left:14px; color:#6b7484; font-size:11px; padding:6px 10px; }

  /* ── 타임라인 ── */
  .tl { max-width:780px; margin:0 auto; position:relative; padding-left:6px; }
  .tl .day { color:var(--muted); font-size:11.5px; font-weight:600; margin:18px 0 8px; letter-spacing:.3px; }
  .tl .item { position:relative; display:flex; gap:11px; align-items:flex-start; padding:9px 12px; margin-left:14px;
    border-left:2px solid var(--border); cursor:pointer; transition:border-color var(--ease), background var(--ease); border-radius:0 8px 8px 0; }
  .tl .item::before { content:''; position:absolute; left:-6px; top:14px; width:9px; height:9px; border-radius:50%; background:var(--surface); border:2px solid var(--border2); }
  .tl .item:hover { background:var(--surface); border-left-color:var(--accent); }
  .tl .item:focus-visible { outline:2px solid var(--accent); outline-offset:-1px; }
  .tl .item:hover::before { border-color:var(--accent); }
  .tl .item .t { color:var(--text); font-size:13px; }

  /* ── 상세 패널 ── */
  .scrim { position:absolute; inset:0; background:rgba(0,0,0,.4); opacity:0; pointer-events:none; transition:opacity var(--ease); z-index:15; }
  .scrim.open { opacity:1; pointer-events:auto; }
  aside { position:absolute; top:0; right:0; bottom:0; width:380px; max-width:92vw; background:var(--surface);
    border-left:1px solid var(--border); padding:0; overflow:auto; transform:translateX(100%);
    transition:transform .22s cubic-bezier(.4,0,.2,1); z-index:20; box-shadow:var(--shadow); }
  aside.open { transform:translateX(0); }
  .dhead { display:flex; align-items:center; gap:10px; padding:16px 18px 12px; position:sticky; top:0; background:var(--surface); border-bottom:1px solid var(--border); }
  .dhead h3 { margin:0; font-size:14px; font-weight:600; flex:1; }
  .iconbtn { background:none; border:1px solid var(--border); color:var(--muted); width:30px; height:30px; border-radius:8px;
    cursor:pointer; display:grid; place-items:center; transition:all var(--ease); line-height:0; flex:none; }
  .iconbtn:hover { color:var(--text); border-color:var(--border2); background:var(--surface2); }
  .iconbtn.danger:hover { color:#fff; background:var(--danger); border-color:var(--danger); }
  .dbody { padding:16px 18px 22px; }
  .dmeta { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
  .tag { font-size:11px; color:var(--muted); background:var(--bg2); border:1px solid var(--border); border-radius:7px; padding:3px 9px; }
  .dcontent { background:var(--surface2); border:1px solid var(--border); border-radius:var(--r); padding:14px; white-space:pre-wrap; word-break:break-word; font-size:14px; line-height:1.6; }
  .dmeta .dtime { color:var(--faint); font-size:11px; align-self:center; }

  /* ── 상세 패널 편집 모드 ── */
  .dedit { display:none; }
  .dedit.on { display:block; }
  .dbody.editing .dcontent, .dbody.editing .drel { display:none; }
  .dedit textarea { width:100%; min-height:140px; resize:vertical; background:var(--surface2); border:1px solid var(--border2); color:var(--text);
    border-radius:var(--r); padding:13px 14px; font:inherit; font-size:14px; line-height:1.65; }
  .dedit textarea:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak); }
  .dedit .erow { display:flex; gap:8px; margin-top:10px; }
  .dedit .erow label { flex:1; display:flex; flex-direction:column; gap:5px; font-size:11px; color:var(--muted); }
  .dedit select { background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 10px; font-size:13px; }
  .dedit .redactnote { display:flex; gap:7px; align-items:flex-start; color:var(--faint); font-size:11px; margin-top:11px; line-height:1.5; }
  .dedit .redactnote svg { flex:none; margin-top:1px; color:var(--ok); }
  .dedit .eact { display:flex; gap:8px; margin-top:14px; }
  .dedit .eact button { border-radius:9px; padding:10px 16px; font-size:13px; font-weight:600; cursor:pointer; transition:filter var(--ease), background var(--ease); }
  .dedit .save { flex:1; background:var(--grad-accent); color:#fff; border:none; }
  .dedit .save:hover { filter:brightness(1.08); }
  .dedit .save:disabled { opacity:.6; cursor:default; }
  .dedit .cancel { background:var(--surface2); color:var(--muted); border:1px solid var(--border2); }
  .dedit .cancel:hover { color:var(--text); }

  /* ── 빈/로딩 상태 ── */
  .empty { color:var(--muted); padding:64px 20px; text-align:center; max-width:420px; margin:40px auto; }
  .empty .ico { width:52px; height:52px; margin:0 auto 16px; border-radius:14px; background:var(--surface); border:1px solid var(--border); display:grid; place-items:center; color:var(--faint); }
  .empty h4 { margin:0 0 6px; color:var(--text); font-size:15px; font-weight:600; }
  .empty p { margin:0; font-size:13px; line-height:1.6; }
  .spinner { width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; margin:60px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }
  mark { background:rgba(232,163,61,.28); color:inherit; border-radius:3px; padding:0 1px; }
  :root[data-theme="light"] mark { background:rgba(232,163,61,.45); }

  /* ── 토스트 ── */
  #toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); z-index:60;
    background:var(--surface); border:1px solid var(--border2); color:var(--text); padding:11px 18px; border-radius:var(--r);
    box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none; transition:all var(--ease); }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.ok { border-color:rgba(45,190,158,.6); } #toast.err { border-color:rgba(242,85,90,.6); }
  #toast .undo { margin-left:10px; background:var(--accent-weak); border:1px solid var(--accent); color:var(--accent); border-radius:7px; padding:3px 10px; font-size:12px; font-weight:600; cursor:pointer; }

  /* ── 커맨드 팔레트 (⌘K / Ctrl+K) ── */
  .cmdk-scrim { position:fixed; inset:0; background:rgba(6,8,12,.5); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); z-index:80; opacity:0; pointer-events:none; transition:opacity var(--ease); }
  .cmdk-scrim.open { opacity:1; pointer-events:auto; }
  .cmdk { position:fixed; left:50%; top:13vh; transform:translateX(-50%) translateY(-10px) scale(.985); width:min(620px,92vw); z-index:81;
    background:var(--surface); border:1px solid var(--border2); border-radius:var(--r-lg); box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:opacity var(--ease), transform var(--ease-spring); overflow:hidden; }
  .cmdk.open { opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0) scale(1); }
  .cmdk-in { display:flex; align-items:center; gap:11px; padding:15px 17px; border-bottom:1px solid var(--border); }
  .cmdk-in svg { color:var(--faint); flex:none; }
  .cmdk-in input { flex:1; background:none; border:none; color:var(--text); font-size:15.5px; outline:none; letter-spacing:.1px; }
  .cmdk-in input::placeholder { color:var(--faint); }
  .cmdk-list { max-height:52vh; overflow:auto; padding:6px; }
  .cmdk-sec { color:var(--faint); font-size:11px; font-weight:700; padding:9px 10px 4px; letter-spacing:.5px; }
  .cmdk-item { display:flex; align-items:center; gap:11px; padding:9px 11px; border-radius:9px; cursor:pointer; color:var(--text); font-size:13.5px; }
  .cmdk-item .ci-ico { width:28px; height:28px; border-radius:8px; background:var(--surface2); border:1px solid var(--border); display:grid; place-items:center; color:var(--muted); flex:none; font-size:14px; }
  .cmdk-item .ci-t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cmdk-item .ci-pill { font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:6px; flex:none; }

  .cmdk-empty { color:var(--faint); font-size:13px; text-align:center; padding:28px; }
  .cmdk-foot { display:flex; gap:15px; padding:9px 15px; border-top:1px solid var(--border); color:var(--faint); font-size:11px; }
  .cmdk-foot b { color:var(--muted); font-weight:600; border:1px solid var(--border2); border-radius:4px; padding:1px 5px; font-family:inherit; }

  /* ── 첫 사용자 안내 배너 ── */
  .introbar { display:flex; align-items:center; gap:10px; padding:10px 18px; background:linear-gradient(90deg,var(--accent-weak),transparent);
    border-bottom:1px solid var(--border); flex:none; font-size:12.5px; color:var(--text); }
  .introbar .ib-ico { color:var(--accent); flex:none; line-height:0; }
  .introbar .ib-txt { flex:1; color:var(--muted); }
  .introbar .ib-txt b { color:var(--text); font-weight:600; }
  .introbar .ib-x { background:none; border:none; color:var(--faint); cursor:pointer; padding:4px 8px; border-radius:6px; line-height:0; flex:none; }
  .introbar .ib-x:hover { color:var(--text); background:var(--surface2); }
  .introbar[hidden] { display:none; }

  /* ── 관계 섹션(상세 패널) ── */
  .drel { margin-top:18px; border-top:1px solid var(--border); padding-top:14px; }
  .drel h4 { margin:0 0 10px; font-size:12.5px; color:var(--muted); font-weight:600; }
  .relrow { display:flex; align-items:center; gap:8px; padding:7px 9px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; margin-bottom:6px; font-size:12px; }
  .relrow .rt { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
  .relrow .x { background:none; border:none; color:var(--faint); cursor:pointer; padding:2px 6px; border-radius:5px; line-height:1; }
  .relrow .x:hover { color:#fff; background:var(--danger); }
  .reltag { font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:6px; white-space:nowrap; }
  .reladd { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .reladd select { flex:1; min-width:96px; background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:7px; padding:7px 8px; font-size:12px; }
  .reladd button { background:var(--accent); border:none; color:#fff; border-radius:7px; padding:7px 14px; font-size:12px; font-weight:600; cursor:pointer; }
  .reladd button:hover { filter:brightness(1.08); }
  .relempty { color:var(--faint); font-size:12px; padding:2px 0 6px; }
  .reladd .hint { flex-basis:100%; color:var(--faint); font-size:11px; margin-top:2px; }
  .eleg { display:flex; flex-wrap:wrap; gap:5px 12px; margin-top:8px; padding-top:8px; border-top:1px solid #232a33; font-size:10.5px; color:#8B93A3; flex-basis:100%; }
  .eleg span { display:inline-flex; align-items:center; }
  .eleg i { display:inline-block; width:15px; height:0; border-top:2px solid; margin-right:5px; vertical-align:middle; }
  .tlsup { margin:2px 0 0 0; font-size:11px; color:var(--faint); padding-left:14px; }

  /* ── 개요/인사이트 홈 ── */
  .ov { max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .ov-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .ov-stat { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:16px 17px; position:relative; overflow:hidden;
    animation:cardIn .42s cubic-bezier(.22,1,.36,1) both; }
  .ov-stat::after { content:''; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--grad-accent); opacity:.85; }
  .ov-stat .n { font-size:30px; font-weight:800; letter-spacing:-.6px; font-variant-numeric:tabular-nums; line-height:1.1; }
  .ov-stat .l { color:var(--muted); font-size:12px; margin-top:5px; }
  .ov-stat .ic { position:absolute; right:13px; top:13px; color:var(--faint); opacity:.45; line-height:0; }
  .ov-stat:nth-child(2)::after{background:linear-gradient(135deg,#2DD4A7,#48C7E0)} .ov-stat:nth-child(2){animation-delay:.05s}
  .ov-stat:nth-child(3)::after{background:linear-gradient(135deg,#E8A33D,#F0B046)} .ov-stat:nth-child(3){animation-delay:.1s}
  .ov-stat:nth-child(4)::after{background:linear-gradient(135deg,#B57BEE,#F2555A)} .ov-stat:nth-child(4){animation-delay:.15s}
  .ov-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:16px 18px; }
  .ov-card h4 { margin:0 0 13px; font-size:13px; font-weight:700; color:var(--text); display:flex; align-items:center; gap:7px; }
  .ov-row2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .ov-bar { display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:12.5px; }
  .ov-bar:last-child { margin-bottom:0; }
  .ov-bar .bl { width:92px; flex:none; color:var(--muted); display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ov-bar .bl i { width:8px; height:8px; border-radius:50%; flex:none; }
  .ov-bar .bt { flex:1; height:8px; background:var(--surface2); border-radius:6px; overflow:hidden; }
  .ov-bar .bf { display:block; height:100%; min-width:3px; border-radius:6px; transition:width .6s var(--ease-spring); }
  .ov-bar .bn { width:30px; text-align:right; color:var(--faint); font-variant-numeric:tabular-nums; flex:none; }
  .ov-hub { display:flex; gap:11px; align-items:flex-start; cursor:pointer; padding:11px 12px; border-radius:9px; background:var(--surface2); border:1px solid var(--border); transition:border-color var(--ease), transform var(--ease); }
  .ov-hub:hover { border-color:var(--border2); transform:translateY(-1px); }
  .ov-hub:last-child { margin-bottom:0; }
  .ov-hub .hubt { flex:1; min-width:0; font-size:13px; color:var(--text); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .ov-hub .hubn { flex:none; color:var(--accent); font-size:11.5px; font-weight:700; }
  .ov-mut { color:var(--faint); font-size:12px; }
  .ov-stat.ov-orphan { cursor:pointer; transition:border-color var(--ease), transform var(--ease); }
  .ov-stat.ov-orphan:hover { border-color:var(--border2); transform:translateY(-2px); }
  .ov-stat.ov-orphan:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .loadmore { width:100%; max-width:880px; margin:2px auto 0; display:block; background:var(--surface); border:1px solid var(--border); color:var(--muted);
    border-radius:var(--r); padding:12px; font-size:13px; font-weight:600; cursor:pointer; transition:all var(--ease); font-variant-numeric:tabular-nums; }
  .loadmore:hover { background:var(--surface2); border-color:var(--border2); color:var(--text); }
  @media (max-width:820px){ .ov-grid{grid-template-columns:repeat(2,1fr)} .ov-row2{grid-template-columns:1fr} }

  /* ── 반응형(모바일 375px) ── */

    aside { width:100%; max-width:100%; }
    .legend { display:none; } #g3d { display:none; }
  }
</style>

    const COLORS = { '결정':'#5B8DEF', '제약':'#F2555A', '선호':'#B57BEE', '패턴':'#E8A33D', '지식':'#2DBE9E' };
    const CATCOLORS = { '보안':'#F2555A','데이터/DB':'#2DBE9E','배포/인프라':'#5B8DEF','AI/모델':'#B57BEE','UI/UX':'#E8A33D','설정/환경':'#48C7E0','규칙/문서':'#9AA4B2','기타':'#6B7280' };
    let colorBy = 'type'; // 그래프 노드 색: 'type'(유형) ↔ 'category'(분류)
    const nodeColorOf = n => colorBy==='category' ? (CATCOLORS[n.category] || '#6B7280') : color(n.type);
    function renderNodeLegend(){
      const host=document.getElementById('nodeLegend'); if(!host) return;
      if(colorBy==='category'){
        const present=[...new Set(((gData&&gData.nodes)?gData.nodes:[]).map(n=>n.category||'기타'))];
        host.innerHTML=present.map(c=>`<span><i class="dot" style="background:${CATCOLORS[c]||'#6B7280'}"></i>${esc(c)}</span>`).join('');
      } else {
        host.innerHTML=TYPES.map(t=>`<span><i class="dot" style="background:${color(t)}"></i>${esc(t)}</span>`).join('');
      }
    }
    const TYPES = ['결정','제약','선호','패턴','지식'];
    const TYPE_DESC = { '결정':'하기로 정한 것', '제약':'하지 말 것·지켜야 할 규칙', '선호':'더 좋아하는 방식', '패턴':'반복되는 방식·습관', '지식':'알아둔 사실·정보' };
    const color = t => COLORS[t] || '#8B93A3';
    const REL = { SUPERSEDES:{ko:'번복함',c:'#5B8DEF',desc:'이 결정이 예전 결정을 대체해요(번복).'}, SUPPORTS:{ko:'뒷받침함',c:'#2DBE9E',desc:'이 기억이 다른 기억의 근거가 돼요.'}, INFLUENCES:{ko:'영향을 줌',c:'#8B93A3',desc:'이 기억이 다른 기억에 영향을 줘요.'}, CONTRADICTS:{ko:'충돌함',c:'#F2555A',desc:'이 기억이 다른 기억과 서로 부딪혀요(충돌).'} };
    const relColor = r => (REL[r] && REL[r].c) || 'rgba(120,135,160,.20)';
    let rels = [];
    const get = u => fetch(u).then(r => r.json());
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
    function hexA(hex, a){ const h=hex.replace('#',''); const n=parseInt(h.length===3?h.replace(/(.)/g,'$1$1'):h,16);
      return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
    function lighten(hex, amt){ const h=hex.replace('#',''); const n=parseInt(h,16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
      r=Math.round(r+(255-r)*amt); g=Math.round(g+(255-g)*amt); b=Math.round(b+(255-b)*amt); return `rgb(${r},${g},${b})`; }

    let all = [], searchResults = null, activeType = '', tab = 'graph', curQuery = '', sortMode = 'new';
    let minImp = 0, period = 'all', localFocus = null, projectFilter = '', orphanView = false; // 중요도/기간/프로젝트 필터 + 로컬(이웃) 포커스 + 고립보기
    let statTotal = 0, listLoading = false; const _memCache = {}; // 대량 대비: 전체 총계 + 목록 더보기 + 단건 캐시
    const baseName = p => String(p||'').split(/[\\/]/).filter(Boolean).pop() || '(미지정)';
    // 기억 1건 얻기 — 로드된 all에 없으면(상한 밖) 서버에서 id로 가져옴(대량 대비)
    async function getMemById(id){ id=Number(id); const a=(all||[]).find(x=>x.id===id); if(a) return a;
      if(_memCache[id]) return _memCache[id]; try{ const m=await get('/api/memory/'+id); _memCache[id]=m; return m; }catch{ return null; } }
    // 개요 막대/행 헬퍼
    function ovBar(c, label, v, max){ return `<div class="ov-bar"><span class="bl"><i style="background:${c}"></i>${esc(label)}</span><span class="bt"><span class="bf" style="background:${c};width:${Math.round(v/Math.max(1,max)*100)}%"></span></span><span class="bn">${v}</span></div>`; }
    function ovHub(id, type, content, suffix){ return `<div class="ov-hub" data-id="${id}" tabindex="0" role="button">${pill(type)}<span class="hubt">${esc(String(content).slice(0,90))}</span><span class="hubn">${esc(suffix)}</span></div>`; }
    async function loadMore(){ if(listLoading) return; listLoading=true;
      try{ const next=await get('/api/memories?limit=100&offset='+all.length);
        if(Array.isArray(next)&&next.length){ const seen=new Set(all.map(m=>m.id)); for(const m of next) if(!seen.has(m.id)) all.push(m); renderLists(); if(tab==='graph') drawGraph(); }
      }catch{} finally{ listLoading=false; } }

    /* 날짜 */
    const pad = n => String(n).padStart(2,'0');
    function parseDate(s){ if(!s) return null; const d=new Date(String(s).replace(' ','T')); return isNaN(d)?null:d; }
    function relTime(s){ const d=parseDate(s); if(!d) return '날짜 미상';
      const sec=Math.floor((Date.now()-d.getTime())/1000);
      if(sec<60) return '방금'; if(sec<3600) return Math.floor(sec/60)+'분 전';
      if(sec<86400) return Math.floor(sec/3600)+'시간 전';
      const day=Math.floor(sec/86400); if(day===1) return '어제'; if(day<7) return day+'일 전';
      return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`; }
    function absTime(s){ const d=parseDate(s); return d?`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`:'-'; }
    const dayKey = s => { const d=parseDate(s); return d?`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`:'날짜 미상'; };

    function impDots(n){ n=Math.max(0,Math.min(5,n|0)); let h='<span class="idots" title="중요도 '+n+'/5">';
      for(let i=0;i<5;i++) h+=`<i class="idot${i<n?' on':''}"></i>`; return h+'</span>'; }
    function pill(t){ const c=color(t); return `<span class="pill" style="background:${hexA(c,.14)};box-shadow:inset 0 0 0 1px ${hexA(c,.30)}"><i class="pdot" style="background:${c}"></i>${esc(t)}</span>`; }
    function hl(text){ const safe=esc(text); if(!curQuery) return safe;
      try { return safe.replace(new RegExp('('+curQuery.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>'); } catch { return safe; } }

    function sortFn(a,b){
      if(sortMode==='old') return (a.created_at||'').localeCompare(b.created_at||'');
      if(sortMode==='imp') return (b.importance||0)-(a.importance||0) || (b.id-a.id);
      return (b.created_at||'').localeCompare(a.created_at||'') || (b.id-a.id);
    }
    function passesFilter(m){
      if(activeType && m.type!==activeType) return false;
      if(minImp && (m.importance||0) < minImp) return false;
      if(projectFilter && (m.project||'')!==projectFilter) return false;
      if(period!=='all'){ const d=parseDate(m.created_at); if(!d) return false; if((Date.now()-d.getTime())/86400000 > Number(period)) return false; }
      return true;
    }
    function currentSet(){ const s = searchResults !== null ? searchResults : all; return s.filter(passesFilter).sort(sortFn); }
    function renderLists(){ const s=currentSet(); renderList(s); renderTimeline(s); renderSubbar(); } // 목록/타임라인/서브바만
    function renderAll(){ renderLists(); if(tab==='graph') drawGraph(); }

    function renderList(mems){ const host=document.getElementById('rows');
      if(!mems.length){ host.innerHTML=emptyState(); return; }
      let html = mems.map(m => `
        <div class="row" data-id="${m.id}" tabindex="0" role="button" aria-label="${esc(m.type)} 기억 열기">
          ${pill(m.type)}
          <div class="rc"><div class="rtext">${hl(m.content)}</div>
            <div class="rmeta">${impDots(m.importance)}<span class="rtime" title="${esc(absTime(m.created_at))}">${esc(relTime(m.created_at))}</span><span class="src">${esc(m.source||'-')}</span></div>
          </div></div>`).join('');
      // 더 보기(대량 대비) — 검색 중이 아니고 아직 안 불러온 기억이 남았을 때만
      if(searchResults===null && statTotal && all.length < statTotal){
        html += `<button class="loadmore" id="loadMore">더 보기 · ${all.length} / ${statTotal}</button>`;
      }
      host.innerHTML = html;
      const lm=host.querySelector('#loadMore'); if(lm) lm.addEventListener('click', loadMore);
    }
    function emptyState(){
      if(searchResults !== null || activeType) return `<div class="empty"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div><h4>결과가 없어요</h4><p>다른 검색어나 필터를 시도해 보세요.</p></div>`;
      return `<div class="empty"><div class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7v5l3 2"/></svg></div><h4>아직 기억이 없어요</h4><p>클로드코드에서 대화하고 세션을 끝내면, 결정·약속·금지 같은 내용이 여기에 자동으로 쌓입니다.</p></div>`;
    }
    function renderTimeline(mems){
      const sorted=[...mems].sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
      const host=document.getElementById('tl');
      if(!sorted.length){ host.innerHTML=emptyState(); return; }
      let html='', lastDay='';
      for(const m of sorted){ const day=dayKey(m.created_at);
        if(day!==lastDay){ html+=`<div class="day">${esc(day)}</div>`; lastDay=day; }
        const sup=rels.filter(r=>r.from_id===m.id && (r.type==='SUPERSEDES'||r.type==='CONTRADICTS'));
        const note=sup.map(r=>`<div class="tlsup">↳ ${esc(REL[r.type].ko)}: ${esc(String(memShort(r.to_id)).slice(0,30))}</div>`).join('');
        html+=`<div class="item" data-id="${m.id}" tabindex="0" role="button">${pill(m.type)}<span class="t">${hl(m.content)}</span></div>${note}`; }
      host.innerHTML=html;
    }

    /* ── 개요/인사이트 (기존 데이터로 클라이언트 계산, 백엔드 변경 없음) ── */
    function svgIco(k){ const p={
        brain:'<path d="M8.5 3A3.5 3.5 0 0 0 5 6.5 3 3 0 0 0 5 12a3 3 0 0 0 1 5.5A3 3 0 0 0 9.5 21 2.5 2.5 0 0 0 12 18.5V5.5A2.5 2.5 0 0 0 9.5 3z"/><path d="M12 5.5A2.5 2.5 0 0 1 14.5 3 3.5 3.5 0 0 1 19 6.5 3 3 0 0 1 19 12a3 3 0 0 1-1 5.5A3 3 0 0 1 14.5 21 2.5 2.5 0 0 1 12 18.5"/>',
        clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/>',
        link:'<path d="M9 17H7A5 5 0 0 1 7 7h2M15 7h2a5 5 0 0 1 0 10h-2M8 12h8"/>',
        alone:'<circle cx="12" cy="8" r="3.4"/><path d="M5.5 20a6.5 6.5 0 0 1 13 0"/>' }[k]||'';
      return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`; }
    async function renderOverview(){
      const host=document.getElementById('ov'); if(!host) return;
      let s; try{ s=await get('/api/stats'); }catch{ s=null; }
      if(!s || !s.total){ host.innerHTML=`<div class="empty"><div class="ico">${svgIco('brain')}</div><h4>아직 보여줄 요약이 없어요</h4><p>클로드코드에서 대화하고 세션을 끝내면, 여기에 한눈에 보는 요약이 쌓입니다.</p></div>`; return; }
      if(s.total) statTotal=s.total; // 목록 더보기 기준 갱신
      const typeMax=Math.max(1,...TYPES.map(t=>s.byType[t]||0));
      const typeBars=TYPES.filter(t=>s.byType[t]).map(t=>ovBar(color(t), t, s.byType[t]||0, typeMax)).join('');
      const catE=Object.entries(s.byCategory||{}).sort((a,b)=>b[1]-a[1]).slice(0,8), catMax=Math.max(1,...catE.map(e=>e[1]));
      const catBars=catE.map(([c,v])=>ovBar(CATCOLORS[c]||'#6B7280', c, v, catMax)).join('');
      const hubHtml=(s.hubs&&s.hubs.length) ? s.hubs.map(h=>ovHub(h.id,h.type,h.content,(h.d)+' 연결')).join('')
        : `<div class="ov-mut">아직 기억끼리 연결된 관계가 없어요. 그래프나 상세 패널에서 연결해 보세요.</div>`;
      const accHtml=(s.topAccessed&&s.topAccessed.length) ? s.topAccessed.map(h=>ovHub(h.id,h.type,h.content,(h.access_count)+'회')).join('')
        : `<div class="ov-mut">아직 자주 본 기억이 없어요. 기억을 열어보면 여기에 쌓여요.</div>`;
      let projHtml='';
      if(s.byProject && s.byProject.length>1){ const pm=Math.max(1,...s.byProject.map(p=>p.c));
        projHtml=`<div class="ov-card"><h4>프로젝트별 기억</h4>${s.byProject.slice(0,8).map(p=>ovBar('#5B8CFF', baseName(p.project), p.c, pm)).join('')}</div>`; }
      host.innerHTML=`
        <div class="ov-grid">
          <div class="ov-stat"><span class="ic">${svgIco('brain')}</span><div class="n">${s.total}</div><div class="l">전체 기억</div></div>
          <div class="ov-stat"><span class="ic">${svgIco('clock')}</span><div class="n">${s.recent7}</div><div class="l">최근 7일 추가</div></div>
          <div class="ov-stat"><span class="ic">${svgIco('link')}</span><div class="n">${s.relCount}</div><div class="l">기억 간 관계</div></div>
          <div class="ov-stat ov-orphan" role="button" tabindex="0" title="그래프에서 연결 없는 기억만 보기"><span class="ic">${svgIco('alone')}</span><div class="n">${s.orphans}</div><div class="l">연결 없는 기억 →</div></div>
        </div>
        <div class="ov-row2">
          <div class="ov-card"><h4>유형 분포</h4>${typeBars||'<div class="ov-mut">데이터 없음</div>'}</div>
          <div class="ov-card"><h4>주제 분류 분포</h4>${catBars||'<div class="ov-mut">분류 정보 없음</div>'}</div>
        </div>
        <div class="ov-row2">
          <div class="ov-card"><h4>가장 많이 연결된 기억</h4>${hubHtml}</div>
          <div class="ov-card"><h4>자주 본 기억</h4>${accHtml}</div>
        </div>
        ${projHtml}
        ${s.lowConf?`<div class="ov-card"><h4>검토하면 좋은 기억</h4><div class="ov-mut">자동 추출 신뢰도가 낮은(50% 미만) 기억이 <b style="color:var(--text)">${s.lowConf}개</b> 있어요. 내용이 맞는지 한 번 확인해 보세요.</div></div>`:''}`;
      host.querySelectorAll('.ov-hub[data-id]').forEach(el=>{ const open=async()=>{ const m=await getMemById(el.dataset.id); if(m) openDetail(m); };
        el.addEventListener('click',open); el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } }); });
      const orphanCard=host.querySelector('.ov-orphan');
      if(orphanCard){ const go=()=>{ orphanView=true; localFocus=null; showTab('graph'); };
        orphanCard.addEventListener('click',go); orphanCard.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } }); }
    }
    function renderSubbar(){
      const base = searchResults !== null ? searchResults : all;
      const counts={}; for(const m of base) counts[m.type]=(counts[m.type]||0)+1;
      let html=`<button class="chip all${activeType===''?' on':''}" data-type="" title="모든 기억 보기"><span>전체</span><span class="cnt">${base.length}</span></button>`;
      for(const t of TYPES){ const c=counts[t]||0; if(c===0 && activeType!==t) continue;
        html+=`<button class="chip${activeType===t?' on':''}" data-type="${t}" title="${esc(t)} — ${esc(TYPE_DESC[t]||'')}"><i class="cdot" style="background:${color(t)}"></i><span>${esc(t)}</span><span class="cnt">${c}</span></button>`; }
      html+=`<select class="sortsel" id="sortSel" aria-label="정렬">
        <option value="new"${sortMode==='new'?' selected':''}>최신순</option>
        <option value="old"${sortMode==='old'?' selected':''}>오래된순</option>
        <option value="imp"${sortMode==='imp'?' selected':''}>중요도순</option></select>`;
      html+=`<select class="sortsel" id="impSel" aria-label="중요도 필터">
        <option value="0"${minImp===0?' selected':''}>중요도 전체</option>
        <option value="3"${minImp===3?' selected':''}>★3 이상</option>
        <option value="4"${minImp===4?' selected':''}>★4 이상</option>
        <option value="5"${minImp===5?' selected':''}>★5</option></select>`;
      html+=`<select class="sortsel" id="perSel" aria-label="기간 필터">
        <option value="all"${period==='all'?' selected':''}>기간 전체</option>
        <option value="7"${period==='7'?' selected':''}>최근 7일</option>
        <option value="30"${period==='30'?' selected':''}>최근 30일</option></select>`;
      // 프로젝트별 마지막 활동 시점 → 최근 활동순 정렬(활성=맨 위, 파기한 옛것은 시점으로 구분)
      const projInfo={};
      for(const m of (all||[])){ const p=m.project||''; if(!p) continue; const d=parseDate(m.created_at); const t=d?d.getTime():0;
        if(!projInfo[p] || t>projInfo[p].t) projInfo[p]={ t, s:m.created_at }; }
      const projects=Object.keys(projInfo).sort((a,b)=>projInfo[b].t-projInfo[a].t);
      if(projects.length>1 || projectFilter){
        html+=`<select class="sortsel" id="projSel" aria-label="프로젝트 필터" title="프로젝트로 거르기(최근 활동순)">`
          +`<option value=""${projectFilter===''?' selected':''}>프로젝트 전체</option>`
          + projects.map(p=>`<option value="${esc(p)}"${projectFilter===p?' selected':''}>${esc(baseName(p))} · ${esc(relTime(projInfo[p].s))}</option>`).join('')
          + `</select>`;
      }
      const shown=currentSet().length;
      const filtered = !!(activeType || minImp || projectFilter || period!=='all');
      const info = searchResults!==null ? `검색 “${esc(curQuery)}” · ${shown}개`
        : (filtered ? `${shown}개 표시 · 총 ${all.length}개` : `총 ${all.length}개의 기억`);
      const sb=document.getElementById('subbar'); sb.innerHTML = html + `<span class="countinfo">${info}</span>`;
      sb.querySelector('#sortSel').addEventListener('change', e=>{ sortMode=e.target.value; renderAll(); });
      sb.querySelector('#impSel').addEventListener('change', e=>{ minImp=Number(e.target.value); renderAll(); });
      sb.querySelector('#perSel').addEventListener('change', e=>{ period=e.target.value; renderAll(); });
      const _ps=sb.querySelector('#projSel'); if(_ps) _ps.addEventListener('change', e=>{ projectFilter=e.target.value; renderAll(); });
    }

    /* 관계(사용자 수동 연결) */
    async function refreshRels(){ try{ rels = await get('/api/relations'); }catch{ rels=[]; } if(!Array.isArray(rels)) rels=[]; }
    const memShort = id => { const x=all.find(a=>a.id===id); return x ? x.content : ('#'+id); };
    function renderRelations(m){
      const host=document.getElementById('d-rel'); if(!host) return;
      const mine=rels.filter(r=>r.from_id===m.id||r.to_id===m.id);
      const list = mine.length ? mine.map(r=>{ const out=r.from_id===m.id; const other=out?r.to_id:r.from_id;
        const meta=REL[r.type]||{ko:r.type,c:'#8B93A3'};
        return `<div class="relrow"><span class="reltag" style="color:${meta.c};background:${hexA(meta.c,.14)}">${out?'→':'←'} ${esc(meta.ko)}</span><span class="rt" title="${esc(memShort(other))}">${esc(memShort(other))}</span><button class="x" data-rel="${r.id}" aria-label="관계 삭제">✕</button></div>`;
      }).join('') : `<div class="relempty">아직 연결된 관계가 없어요.</div>`;
      const opts=all.filter(a=>a.id!==m.id).map(a=>`<option value="${a.id}">[${esc(a.type)}] ${esc(String(a.content).slice(0,28))}</option>`).join('');
      const typeOpts=Object.keys(REL).map(k=>`<option value="${k}">${esc(REL[k].ko)}</option>`).join('');
      const firstType=Object.keys(REL)[0];
      host.innerHTML = `<h4>이 기억의 관계</h4>${list}
        <div class="reladd">
          <select id="relType" aria-label="관계 유형">${typeOpts}</select>
          <select id="relTarget" aria-label="대상 기억">${opts}</select>
          <button id="relAdd">연결</button>
          <span class="hint" id="relHint">${esc(REL[firstType].desc)}</span>
        </div>
        <div class="relsug" style="margin-top:10px">
          <div style="font-size:.82rem;color:var(--muted);margin-bottom:6px">🔗 관련 있을 만한 기억 — 눌러서 대상 선택 → 종류 고르고 '연결'</div>
          <div id="relSugList" style="display:flex;flex-direction:column;gap:5px"><span style="color:var(--muted);font-size:.82rem">불러오는 중…</span></div>
        </div>`;
      const sel=host.querySelector('#relType');
      if(sel) sel.addEventListener('change',()=>{ const h=host.querySelector('#relHint'); if(h) h.textContent=(REL[sel.value]||{}).desc||''; });
      loadRelSuggest(m.id);
    }

    // 관계 '대상' 추천 — 기존 임베딩 유사도 상위 기억. 클릭하면 대상 드롭다운에 채워줌(종류는 사용자가 선택).
    async function loadRelSuggest(id){
      const box=document.getElementById('relSugList'); if(!box) return;
      let sug=[]; try{ sug=await get('/api/memory/'+id+'/similar'); }catch{ sug=[]; }
      if(!Array.isArray(sug)||!sug.length){ box.innerHTML='<span style="color:var(--muted);font-size:.82rem">추천할 비슷한 기억이 아직 없어요.</span>'; return; }
      box.innerHTML = sug.map(s=>`<button type="button" class="sugchip" data-sid="${s.id}" style="text-align:left;border:1px solid var(--border);background:var(--surface2);color:var(--text);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:.84rem;line-height:1.35"><b style="color:var(--accent)">[${esc(s.type)}]</b> ${esc(String(s.content).slice(0,46))}</button>`).join('');
      box.querySelectorAll('.sugchip').forEach(btn=>btn.addEventListener('click',()=>{
        const sid=btn.getAttribute('data-sid');
        const tg=document.getElementById('relTarget'); if(!tg) return;
        if(!tg.querySelector('option[value="'+sid+'"]')){ const o=document.createElement('option'); o.value=sid; o.textContent=btn.textContent.trim(); tg.appendChild(o); }
        tg.value=sid;
        box.querySelectorAll('.sugchip').forEach(b=>b.style.outline='');
        btn.style.outline='2px solid var(--accent)';
        const h=document.getElementById('relHint'); if(h) h.textContent='대상 선택됨 → 종류 고르고 "연결"을 누르세요.';
        const rt=document.getElementById('relType'); if(rt) rt.focus();
      }));
    }

    /* 상세 패널 + 포커스 관리 */
    let curDetail=null, lastFocused=null;
    function openDetail(m){ curDetail=m; lastFocused=document.activeElement; exitEditUI();
      document.getElementById('d-title').textContent = `${m.type} 기억`;
      const meta=document.getElementById('d-meta');
      meta.innerHTML=[pill(m.type),
        m.category?`<span class="tag"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${CATCOLORS[m.category]||'#6B7280'};margin-right:5px"></i>${esc(m.category)}</span>`:'',
        `<span class="tag">중요도 <b style="color:var(--star)">${'★'.repeat(Math.max(0,Math.min(5,m.importance|0)))||'-'}</b></span>`,
        `<span class="tag">출처 ${esc(m.source||'-')}</span>`,
        m.confidence!=null?`<span class="tag">신뢰도 ${Math.round(m.confidence*100)}%</span>`:'',
        (m.access_count? `<span class="tag">조회 ${m.access_count}회</span>`:''),
        `<span class="dtime">${esc(absTime(m.created_at))}</span>`].filter(Boolean).join('');
      document.getElementById('d-content').textContent=m.content;
      renderRelations(m);
      if(m.id) fetch('/api/memory/'+m.id+'/touch',{method:'POST'}).then(()=>{ m.access_count=(m.access_count||0)+1; gData=null; }).catch(()=>{}); // 조회 기록(글로우)
      document.getElementById('detail').classList.add('open');
      document.getElementById('scrim').classList.add('open');
      document.getElementById('d-close').focus();
    }
    function closeDetail(){ exitEditUI(); document.getElementById('detail').classList.remove('open'); document.getElementById('scrim').classList.remove('open');
      curDetail=null; if(lastFocused && lastFocused.focus){ try{ lastFocused.focus(); }catch(e){} } }

    /* 상세 편집(내용/유형/중요도) — 저장 시 서버에서 재redact+재임베딩 */
    function exitEditUI(){ const b=document.getElementById('d-body'); if(b) b.classList.remove('editing'); const f=document.getElementById('d-edit-form'); if(f) f.classList.remove('on'); }
    function enterEdit(){ if(!curDetail) return; const m=curDetail;
      const ta=document.getElementById('e-content'); ta.value=m.content||'';
      document.getElementById('e-type').innerHTML=TYPES.map(t=>`<option value="${t}"${t===m.type?' selected':''}>${esc(t)} — ${esc(TYPE_DESC[t]||'')}</option>`).join('');
      document.getElementById('e-imp').innerHTML=[1,2,3,4,5].map(n=>`<option value="${n}"${n===(m.importance|0)?' selected':''}>${'★'.repeat(n)} (${n})</option>`).join('');
      document.getElementById('d-body').classList.add('editing'); document.getElementById('d-edit-form').classList.add('on');
      setTimeout(()=>ta.focus(),20); }
    async function saveEdit(){ if(!curDetail) return; const m=curDetail;
      const content=document.getElementById('e-content').value.trim();
      const type=document.getElementById('e-type').value, importance=Number(document.getElementById('e-imp').value);
      if(!content){ toast('내용을 입력하세요','err'); return; }
      const btn=document.getElementById('e-save'), prev=btn.textContent; btn.disabled=true; btn.textContent='저장 중…';
      try{
        const r=await fetch('/api/memory/'+m.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({content,type,importance})});
        const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'');
        Object.assign(m,{content,type,importance,source:'user',confidence:1});
        const a=all.find(x=>x.id===m.id); if(a) Object.assign(a,{content,type,importance,source:'user',confidence:1});
        if(searchResults){ const s=searchResults.find(x=>x.id===m.id); if(s) Object.assign(s,{content,type,importance,source:'user',confidence:1}); }
        gData=null; exitEditUI(); openDetail(m); renderAll();
        toast(j.redactedHits ? `저장했어요 · 민감정보 ${j.redactedHits}곳 자동 가림` : '기억을 수정했어요','ok');
      }catch(err){ toast('수정 실패'+(err.message?': '+err.message:''),'err'); btn.disabled=false; btn.textContent=prev; } }

    async function delMemory(){ if(!curDetail) return; const m=curDetail;
      if(!confirm(`이 기억을 삭제할까요?\n\n“${m.content.slice(0,80)}”\n\n※ 되돌릴 수 없습니다(서버 시작 시 백업본은 남아 있어요).`)) return;
      try { const r=await fetch('/api/memory/'+m.id,{method:'DELETE'}); if(!r.ok) throw 0;
        all=all.filter(x=>x.id!==m.id); if(searchResults!==null) searchResults=searchResults.filter(x=>x.id!==m.id); if(statTotal>0) statTotal--;
        gData=null; closeDetail(); renderAll(); toast('기억을 삭제했어요','ok');
      } catch { toast('삭제하지 못했어요(서버 확인)','err'); } }
    async function copyDetail(){ if(!curDetail) return;
      try { await navigator.clipboard.writeText(curDetail.content); toast('내용을 복사했어요','ok'); }
      catch { toast('복사하지 못했어요','err'); } }

    /* 내보내기 */
    function exportData(fmt){
      const data=[...all].sort(sortFn);
      let text, name, mime;
      if(fmt==='json'){ text=JSON.stringify(data,null,2); name='obrain-memories.json'; mime='application/json'; }
      else { text='# O-Brain 기억 내보내기\n\n'+data.map(m=>`- **[${m.type}]** (★${m.importance||0} · ${absTime(m.created_at)} · ${m.source||'-'})\n  ${String(m.content).replace(/\n/g,'\n  ')}`).join('\n'); name='obrain-memories.md'; mime='text/markdown'; }
      try {
        const blob=new Blob([text],{type:mime+';charset=utf-8'}); const url=URL.createObjectURL(blob);
        const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),1500); toast('내보냈어요: '+name,'ok');
      } catch(e){ toast('내보내기 실패','err'); }
      document.getElementById('exportMenu').classList.remove('open');
      document.getElementById('exportBtn').setAttribute('aria-expanded','false');
    }

    /* 테마 */
    const sunIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 1v2.5M12 20.5V23M4.2 4.2l1.8 1.8M18 18l1.8 1.8M1 12h2.5M20.5 12H23M4.2 19.8 6 18M18 6l1.8-1.8"/></svg>';
    const moonIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    function applyThemeIcon(){ const light=document.documentElement.dataset.theme==='light';
      document.getElementById('themeBtn').innerHTML = light?moonIcon:sunIcon; }
    function toggleTheme(){ const light=document.documentElement.dataset.theme==='light';
      const next=light?'dark':'light'; if(next==='dark') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme='light';
      try{ localStorage.setItem('obrain-theme',next); }catch(e){} applyThemeIcon();
      if(tab==='graph') drawGraph(); } // 그래프 색도 테마 따라 다시 그림
    applyThemeIcon();

    /* 첫 사용자 안내 배너 */
    (function(){ let done=false; try{ done=localStorage.getItem('obrain-intro-done')==='1'; }catch(e){}
      const bar=document.getElementById('introbar'); if(bar && !done) bar.hidden=false;
      const x=document.getElementById('introX'); if(x) x.addEventListener('click',()=>{ if(bar) bar.hidden=true; try{localStorage.setItem('obrain-intro-done','1');}catch(e){} }); })();

    /* 토스트 */
    let toastTimer;
    function toast(msg, kind, undoFn){ const el=document.getElementById('toast'); el.className=''; el.textContent=msg;
      if(undoFn){ const b=document.createElement('button'); b.className='undo'; b.textContent='되돌리기'; b.onclick=()=>{ el.classList.remove('show'); undoFn(); }; el.appendChild(b); }
      void el.offsetWidth; el.classList.add('show'); if(kind) el.classList.add(kind);
      clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'), undoFn?5500:2200); }

    /* 탭 */
    function showTab(t){ tab=t;
      for(const x of ['overview','list','graph','timeline']){
        document.getElementById('view-'+x).hidden=(x!==t);
        const b=document.getElementById('t-'+x); b.classList.toggle('on', x===t); b.setAttribute('aria-selected', x===t?'true':'false'); }
      document.getElementById('subbar').style.display = (t==='overview') ? 'none' : '';
      if(t==='overview') renderOverview();
      if(t==='graph') initGraph(); }

    /* 검색 */
    let timer; const qEl=document.getElementById('q');
    qEl.addEventListener('input', e=>{ clearTimeout(timer); const q=e.target.value.trim();
      document.getElementById('searchWrap').classList.toggle('has', !!q);
      timer=setTimeout(async ()=>{ curQuery=q;
        if(!q){ searchResults=null; searchHits=null; renderLists(); if(tab==='graph') _reapply(); return; }
        try { searchResults=await get('/api/search?q='+encodeURIComponent(q)); } catch { searchResults=[]; }
        searchHits=new Set((searchResults||[]).map(m=>m.id));   // 그래프 강조 대상
        renderLists(); if(tab==='graph') _reapply();            // 그래프면 일치 점 강조(목록으로 튕기지 않음). 목록/타임라인이면 이미 갱신됨
      },240); });
    document.getElementById('qClear').addEventListener('click',()=>{ qEl.value=''; curQuery=''; searchResults=null; searchHits=null;
      document.getElementById('searchWrap').classList.remove('has'); renderLists(); if(tab==='graph') _reapply(); qEl.focus(); });

    /* 클릭/키보드 위임 */
    function openById(el){ const id=el.dataset.id; const m=all.find(x=>String(x.id)===id)||(searchResults||[]).find(x=>String(x.id)===id); if(m) openDetail(m); }
    document.querySelector('main').addEventListener('click', e=>{
      const chip=e.target.closest('.chip'); if(chip){ activeType=chip.dataset.type||''; renderAll(); return; }
      const el=e.target.closest('[data-id]'); if(el) openById(el); });
    document.querySelector('main').addEventListener('keydown', e=>{
      if((e.key==='Enter'||e.key===' ')){ const el=e.target.closest('[data-id]'); if(el){ e.preventDefault(); openById(el); } } });
    document.getElementById('subbar').addEventListener('click', e=>{ const chip=e.target.closest('.chip'); if(chip){ activeType=chip.dataset.type||''; renderAll(); } });
    document.querySelectorAll('.segmented [data-tab]').forEach(b=>b.addEventListener('click',()=>showTab(b.dataset.tab)));
    document.getElementById('g2d').addEventListener('click',()=>setGraphMode('2d'));
    document.getElementById('g3d').addEventListener('click',()=>setGraphMode('3d'));
    document.getElementById('gColor').addEventListener('click',()=>{ colorBy = colorBy==='type'?'category':'type';
      const b=document.getElementById('gColor'); b.classList.toggle('on', colorBy==='category'); b.textContent = colorBy==='category'?'유형색':'분류색';
      drawGraph(); });
    document.getElementById('d-focus').addEventListener('click',()=>{ if(!curDetail) return; localFocus=curDetail.id; closeDetail(); showTab('graph'); }); // 이 기억 중심(로컬) 보기
    document.getElementById('gAll').addEventListener('click',()=>{ localFocus=null; orphanView=false; drawGraph(); }); // 전체 보기 복귀
    document.getElementById('d-close').addEventListener('click',closeDetail);
    document.getElementById('scrim').addEventListener('click',closeDetail);
    document.getElementById('d-copy').addEventListener('click',copyDetail);
    document.getElementById('d-del').addEventListener('click',delMemory);
    document.getElementById('d-edit').addEventListener('click',enterEdit);
    document.getElementById('e-save').addEventListener('click',saveEdit);
    document.getElementById('e-cancel').addEventListener('click',exitEditUI);
    // 관계 추가/삭제(이벤트 위임 — 상세 패널 내용이 매번 새로 그려져도 동작)
    document.getElementById('d-rel').addEventListener('click', async e=>{
      const del=e.target.closest('[data-rel]');
      if(del){ const gone=rels.find(x=>String(x.id)===del.dataset.rel);
        try{ const r=await fetch('/api/relation/'+del.dataset.rel,{method:'DELETE'}); if(!r.ok) throw 0;
        await refreshRels(); if(curDetail) renderRelations(curDetail); gData=null; if(tab==='graph') drawGraph(); renderTimeline(currentSet());
        toast('관계를 지웠어요','ok', gone?async()=>{ try{ await fetch('/api/relation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from_id:gone.from_id,to_id:gone.to_id,type:gone.type})}); await refreshRels(); if(curDetail) renderRelations(curDetail); gData=null; if(tab==='graph') drawGraph(); renderTimeline(currentSet()); toast('되돌렸어요','ok'); }catch{ toast('되돌리기 실패','err'); } }:null);
      }catch{ toast('관계 삭제 실패','err'); } return; }
      if(e.target.id==='relAdd'){
        if(!curDetail) return;
        const type=document.getElementById('relType').value, to=Number(document.getElementById('relTarget').value);
        if(!to){ toast('대상 기억을 고르세요','err'); return; }
        try{ const r=await fetch('/api/relation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from_id:curDetail.id,to_id:to,type})});
          const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||'');
          await refreshRels(); renderRelations(curDetail); gData=null; if(tab==='graph') drawGraph(); renderTimeline(currentSet()); toast('관계를 연결했어요','ok');
        }catch(err){ toast('연결 실패'+(err.message?': '+err.message:''),'err'); }
      }
    });
    document.getElementById('themeBtn').addEventListener('click',toggleTheme);
    const exBtn=document.getElementById('exportBtn'), exMenu=document.getElementById('exportMenu');
    exBtn.addEventListener('click', e=>{ e.stopPropagation(); const open=exMenu.classList.toggle('open'); exBtn.setAttribute('aria-expanded', open?'true':'false'); });
    exMenu.querySelectorAll('[data-fmt]').forEach(b=>b.addEventListener('click',()=>exportData(b.dataset.fmt)));
    document.addEventListener('click', e=>{ if(!e.target.closest('#exportBtn')&&!e.target.closest('#exportMenu')){ exMenu.classList.remove('open'); exBtn.setAttribute('aria-expanded','false'); } });

    /* 단축키 */
    document.addEventListener('keydown', e=>{
      if(e.key==='Escape'){ exMenu.classList.remove('open'); closeDetail(); }
      else if(e.key==='/' && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||'')){ e.preventDefault(); qEl.focus(); } });

    /* ── 커맨드 팔레트 (⌘K / Ctrl+K) ── */
    (function(){
      const scrim=document.getElementById('cmdkScrim'), box=document.getElementById('cmdk'),
            input=document.getElementById('cmdkInput'), listEl=document.getElementById('cmdkList');
      let open=false, sel=0, items=[];
      const CMDS=[
        {t:'목록 보기', ico:'≡', hint:'탭', run:()=>showTab('list')},
        {t:'그래프 보기', ico:'◔', hint:'탭', run:()=>showTab('graph')},
        {t:'타임라인 보기', ico:'≣', hint:'탭', run:()=>showTab('timeline')},
        {t:'밝게 / 어둡게 전환', ico:'◐', hint:'테마', run:()=>toggleTheme()},
        {t:'JSON으로 내보내기', ico:'⤓', hint:'내보내기', run:()=>exportData('json')},
        {t:'마크다운으로 내보내기', ico:'⤓', hint:'내보내기', run:()=>exportData('md')},
      ];
      function render(q){
        q=(q||'').trim().toLowerCase();
        const cmds=CMDS.filter(c=>!q || c.t.toLowerCase().includes(q));
        const mems=q ? (all||[]).filter(m=>String(m.content).toLowerCase().includes(q)).slice(0,8)
                     : (all||[]).slice(0,5);
        items=[]; let html='';
        if(cmds.length){ html+='<div class="cmdk-sec">명령</div>';
          cmds.forEach(c=>{ const i=items.length; items.push({type:'cmd',run:c.run});
            html+=`<div class="cmdk-item" data-i="${i}" role="option"><span class="ci-ico">${c.ico}</span><span class="ci-t">${esc(c.t)}</span><span class="ci-hint">${esc(c.hint)}</span></div>`; }); }
        if(mems.length){ html+=`<div class="cmdk-sec">기억 ${q?'검색':'최근'}</div>`;
          mems.forEach(m=>{ const i=items.length; items.push({type:'mem',m}); const c=color(m.type);
            html+=`<div class="cmdk-item" data-i="${i}" role="option"><span class="ci-pill" style="color:${c};background:${hexA(c,.15)}">${esc(m.type)}</span><span class="ci-t">${esc(String(m.content).slice(0,84))}</span></div>`; }); }
        listEl.innerHTML = (cmds.length||mems.length) ? html : '<div class="cmdk-empty">결과가 없어요</div>';
        sel=0; mark();
      }
      function mark(){ const els=[...listEl.querySelectorAll('.cmdk-item')]; els.forEach((el,i)=>el.classList.toggle('sel',i===sel));
        const cur=els[sel]; if(cur) cur.scrollIntoView({block:'nearest'}); }
      function exec(i){ const it=items[i]; if(!it) return; close(); if(it.type==='cmd') it.run(); else openDetail(it.m); }
      function openP(){ open=true; scrim.classList.add('open'); box.classList.add('open'); input.value=''; render(''); setTimeout(()=>input.focus(),20); }
      function close(){ open=false; scrim.classList.remove('open'); box.classList.remove('open'); }
      input.addEventListener('input', e=>render(e.target.value));
      listEl.addEventListener('click', e=>{ const el=e.target.closest('[data-i]'); if(el) exec(Number(el.dataset.i)); });
      listEl.addEventListener('mousemove', e=>{ const el=e.target.closest('[data-i]'); if(el){ sel=Number(el.dataset.i); mark(); } });
      scrim.addEventListener('click', close);
      document.addEventListener('keydown', e=>{
        if((e.key==='k'||e.key==='K') && (e.metaKey||e.ctrlKey)){ e.preventDefault(); open?close():openP(); return; }
        if(!open) return;
        if(e.key==='Escape'){ e.preventDefault(); e.stopImmediatePropagation(); close(); }
        else if(e.key==='ArrowDown'){ e.preventDefault(); sel=Math.min(sel+1,items.length-1); mark(); }
        else if(e.key==='ArrowUp'){ e.preventDefault(); sel=Math.max(sel-1,0); mark(); }
        else if(e.key==='Enter'){ e.preventDefault(); exec(sel); }
      }, true);
    })();

    /* ── 목록 키보드 내비 (↑/↓ · j/k) ── */
    (function(){
      const sec=document.getElementById('view-list');
      sec.addEventListener('keydown', e=>{
        if(!/^(ArrowDown|ArrowUp|j|k)$/.test(e.key)) return;
        const rows=[...document.querySelectorAll('#rows .row')]; if(!rows.length) return;
        const cur=document.activeElement.closest? document.activeElement.closest('.row'):null;
        let idx=rows.indexOf(cur);
        if(e.key==='ArrowDown'||e.key==='j') idx=Math.min(idx+1,rows.length-1);
        else idx=Math.max(idx-1,0);
        if(idx<0) idx=0;
        e.preventDefault(); rows[idx].focus();
      });
    })();

    /* ── 그래프 ── */
    let gMode='2d', gData=null, G=null;
    let highlightNodes=new Set(), highlightLinks=new Set();
    let searchHits=null, _reapply=()=>{};                 // 검색 강조 대상(없으면 null) / 그래프 재착색 함수
    const EMPTY=new Set();
    const lid = e => (typeof e==='object'&&e)?e.id:e;
    const effHi = () => highlightNodes.size ? highlightNodes : (searchHits || EMPTY); // hover 우선, 없으면 검색
    // 테마별 그래프 색(라이트/다크 모두 가독) — '항상 다크' 철회, 테마를 따라감
    function gTheme(){
      const light=document.documentElement.dataset.theme==='light';
      return light
        ? { host:'radial-gradient(circle at 50% 35%, #ffffff 0%, #e9edf4 78%)', hi:'rgba(47,107,255,.95)',
            label:'#243042', labelDim:'rgba(36,48,66,.30)', stroke:'rgba(15,23,42,.22)', strokeDim:'rgba(15,23,42,.06)',
            linkBase:'rgba(90,105,130,.34)', linkDim:'rgba(90,105,130,.10)', dim3d:'#c4ccd8',
            tip:'background:#ffffff;border:1px solid #d3dae3;color:#0f172a' }
        : { host:'radial-gradient(circle at 50% 38%, #11161f 0%, #0B0D11 70%)', hi:'rgba(150,180,255,.95)',
            label:'#D7DEEA', labelDim:'rgba(231,235,242,.32)', stroke:'rgba(255,255,255,.28)', strokeDim:'rgba(255,255,255,.05)',
            linkBase:'rgba(120,135,160,.3)', linkDim:'rgba(110,122,145,.08)', dim3d:'#39414f',
            tip:'background:#11151c;border:1px solid #2C3340;color:#E7EBF2' };
    }
    function graphSet(){
      if(!gData) return {nodes:[],links:[],edgeMode:''};
      let nodes, links;
      if(orphanView){                                                          // 고립: '사용자 관계'가 없는 노드만(개요 정의와 일치 — 유사도선은 제외)
        const deg={}; for(const l of gData.links){ if(l.rel){ deg[lid(l.source)]=1; deg[lid(l.target)]=1; } }
        nodes=gData.nodes.filter(n=>!deg[n.id]); links=[];
        return { nodes, links, edgeMode:gData.edgeMode };
      }
      if(localFocus!=null && gData.nodes.some(n=>n.id===localFocus)){          // 로컬: 그 기억 + 직접 연결만
        const keep=new Set([localFocus]);
        for(const l of gData.links){ const s=lid(l.source),t=lid(l.target); if(s===localFocus) keep.add(t); if(t===localFocus) keep.add(s); }
        nodes=gData.nodes.filter(n=>keep.has(n.id));
        links=gData.links.filter(l=>keep.has(lid(l.source))&&keep.has(lid(l.target)));
      } else if(activeType || minImp || period!=='all' || projectFilter){      // 필터: 노드 자체 필드로(대량 대비, all 의존 X)
        nodes=gData.nodes.filter(passesFilter);
        const keep=new Set(nodes.map(n=>n.id));
        links=gData.links.filter(l=>keep.has(lid(l.source))&&keep.has(lid(l.target)));
      } else { return gData; }                                                // 필터/포커스 없음 → 기존 그대로
      return { nodes, links, edgeMode:gData.edgeMode };
    }
    async function initGraph(){ if(!gData) gData=await get('/api/graph'); drawGraph(); }
    function setGraphMode(m){ gMode=m; document.getElementById('g2d').classList.toggle('on',m==='2d'); document.getElementById('g3d').classList.toggle('on',m==='3d'); drawGraph(); }
    const nodeR = n => 3.7*Math.sqrt(Math.max(1, n.val||1));

    function drawGraph(){
      if(!gData){ initGraph(); return; }   // gData 미로딩 시 fetch 후 재호출(초기 로드/삭제/관계변경 자가치유 — null 역참조로 죽던 버그 방지)
      const el=document.getElementById('graphHost'); el.innerHTML=''; highlightNodes.clear(); highlightLinks.clear();
      renderNodeLegend();
      { const _ga=document.getElementById('gAll'); if(_ga){ _ga.style.display = (localFocus!=null||orphanView) ? '' : 'none'; _ga.textContent = orphanView ? '전체 보기' : '전체 보기'; } }
      const th=gTheme(); el.style.background=th.host;          // 그래프 배경도 테마 따라감
      const data=graphSet();
      const capNote = (gData.total>gData.shown) ? ` · 전체 ${gData.total}개 중 상위 ${gData.shown}개` : '';
      const modeNote = orphanView ? '고립 기억만 · ' : '';
      document.getElementById('gcount').textContent = data.nodes.length ? `${modeNote}노드 ${data.nodes.length} · 연결 ${data.links.length}${gData.relCount?` · 관계 ${gData.relCount}`:''}${capNote}` : (orphanView?'고립된 기억이 없어요 🎉':'');
      if(!data.nodes.length){ el.innerHTML='<div class="empty"><div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="6" r="2.4"/><circle cx="19" cy="9" r="2.4"/><circle cx="9" cy="18" r="2.4"/></svg></div><h4>그릴 기억이 없어요</h4><p>대화가 쌓이면 비슷한 기억끼리 선으로 이어진 지도가 그려집니다.</p></div>'; _reapply=()=>{}; return; }
      const dim = n => { const h=effHi(); return h.size && !h.has(lid(n)); }; // hover 또는 검색으로 흐려짐
      // 링크 색: 직접강조>파랑, hover중 비강조>흐림, 검색중 양끝일치면 보통/아니면 흐림, 평소 관계색/기본
      const linkColorFn = l => highlightLinks.has(l) ? th.hi
        : (highlightNodes.size ? th.linkDim
        : (searchHits ? ((searchHits.has(lid(l.source))&&searchHits.has(lid(l.target))) ? (l.rel?relColor(l.rel):th.linkBase) : th.linkDim)
        : (l.rel?relColor(l.rel):th.linkBase)));
      const base = fg => fg.graphData(JSON.parse(JSON.stringify(data))).backgroundColor('rgba(0,0,0,0)')
        .nodeRelSize(3.7).nodeVal(n=>Math.max(1,n.val||1)).linkCurvature(0.13)
        .nodeLabel(n=>{ const m=all.find(x=>x.id===n.id)||{}; const imp=Math.max(1,Math.min(5,m.importance||Math.round(n.val||1)));
          return `<div style="${th.tip};padding:10px 13px;border-radius:11px;box-shadow:0 12px 34px rgba(0,0,0,.42);max-width:290px;font:12px/1.55 system-ui">`
            +`<div style="font-weight:700;margin-bottom:3px">${esc(n.type)}${n.category?` <span style="opacity:.6">· ${esc(n.category)}</span>`:''}</div>`
            +`<div style="opacity:.86;margin-bottom:6px">${esc(String(n.name).slice(0,96))}</div>`
            +`<div style="color:#F0B046;font-size:11px;letter-spacing:1px">${'★'.repeat(imp)}<span style="opacity:.5;letter-spacing:0"> · 조회 ${n.access||0}회</span></div></div>`; })
        .onNodeClick(n=>getMemById(n.id).then(m=>openDetail(m||{id:n.id,type:n.type,importance:n.importance||Math.round(n.val||1),content:n.name,category:n.category,access_count:n.access,created_at:n.created_at,project:n.project,confidence:n.confidence,source:'-'})));

      if(gMode==='3d'){
        const nc3=n=>dim(n)?th.dim3d:nodeColorOf(n);
        const lw3=l=>highlightLinks.has(l)?2.4:(l.rel?1:.5);
        const lp3=l=>highlightLinks.has(l)?3:0;
        G=base(ForceGraph3D()(el)).nodeColor(nc3).nodeOpacity(.95).nodeResolution(18)
          .linkColor(linkColorFn).linkWidth(lw3).linkOpacity(.55)
          .linkDirectionalArrowLength(l=>l.rel?3:0).linkDirectionalArrowRelPos(1)
          .linkDirectionalParticles(lp3).linkDirectionalParticleWidth(2).linkDirectionalParticleColor(()=>th.hi)
          .onNodeHover(node=>{ highlightNodes.clear(); highlightLinks.clear();
            if(node){ highlightNodes.add(node.id); for(const l of G.graphData().links){ const s=lid(l.source),t=lid(l.target);
              if(s===node.id||t===node.id){ highlightLinks.add(l); highlightNodes.add(s); highlightNodes.add(t); } } }
            _reapply(); });
        _reapply=()=>{ try{ G.nodeColor(nc3).linkColor(linkColorFn).linkWidth(lw3).linkDirectionalParticles(lp3); }catch(e){} }; // 3D 자동리렌더X→재적용(hover·검색 공용)
      } else {
        G=base(ForceGraph()(el)).autoPauseRedraw(false)
          .linkColor(linkColorFn)
          .linkWidth(l=>highlightLinks.has(l)?2.6:(l.rel?1.8:.7))
          .linkDirectionalArrowLength(l=>l.rel?3.4:0).linkDirectionalArrowRelPos(1)
          .linkDirectionalParticles(l=>highlightLinks.has(l)?4:0).linkDirectionalParticleWidth(2.2).linkDirectionalParticleColor(()=>th.hi)
          .nodeCanvasObjectMode(()=>'replace')
          .nodeCanvasObject((n,ctx,scale)=>{
            if(!Number.isFinite(n.x)||!Number.isFinite(n.y)) return; // 초기 프레임 좌표 미정 가드
            const r=nodeR(n), c=nodeColorOf(n), faded=dim(n), hot=highlightNodes.has(n.id);
            if(!faded){ const a=n.access||0; const gr=r+(hot?6:(3+Math.min(a,5)*0.8)); const gl=hot?.26:Math.min(.10+a*0.04,.30); ctx.beginPath(); ctx.arc(n.x,n.y,gr,0,2*Math.PI); ctx.fillStyle=hexA(c,gl); ctx.fill(); } // 글로우=조회수
            const g=ctx.createRadialGradient(n.x-r*.35,n.y-r*.35,r*.1,n.x,n.y,r);
            g.addColorStop(0, faded?hexA(c,.40):lighten(c,.45)); g.addColorStop(1, faded?hexA(c,.22):c);
            ctx.beginPath(); ctx.arc(n.x,n.y,r,0,2*Math.PI); ctx.fillStyle=g; ctx.fill();
            ctx.lineWidth=.8; ctx.strokeStyle=faded?th.strokeDim:th.stroke; ctx.stroke();
            if(scale>1.35||hot||(n.val||0)>=6||(searchHits&&searchHits.has(n.id))){ ctx.fillStyle=faded?th.labelDim:th.label;
              ctx.font=`${(n.val||0)>=6?600:400} ${Math.max(3.2,11/scale)}px -apple-system,system-ui,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='top';
              ctx.fillText(String(n.name).slice(0, hot?28:16), n.x, n.y+r+3/scale+1.5); } })
          .onNodeHover(node=>{ highlightNodes.clear(); highlightLinks.clear();
            if(node){ highlightNodes.add(node.id); for(const l of G.graphData().links){ const s=lid(l.source),t=lid(l.target);
              if(s===node.id||t===node.id){ highlightLinks.add(l); highlightNodes.add(s); highlightNodes.add(t); } } }
            el.style.cursor=node?'pointer':''; })
          .onBackgroundClick(()=>{ highlightNodes.clear(); highlightLinks.clear(); });
        _reapply=()=>{}; // 2D는 autoPauseRedraw=false → 매 프레임 자동 반영(검색/hover 즉시 보임)
      }
      if(gMode==='2d' && typeof G.linkLineDash==='function'){ G.linkLineDash(l=>l.rel==='CONTRADICTS'?[4,3]:null); } // 충돌=점선
      try { G.d3Force('charge').strength(-330); G.d3Force('link').distance(72); } catch(e){}
      // 초기 자동맞춤: 물리 안정화(엔진 정지) 후 1회 — 너무 이른 zoomToFit로 과확대되는 문제 방지
      let _fit=false; const _doFit=()=>{ if(_fit) return; _fit=true; try{ G.zoomToFit(600,120); }catch(e){} };
      if(typeof G.onEngineStop==='function') G.onEngineStop(_doFit);
      setTimeout(_doFit, 1600);
    }
    // 줌 컨트롤
    document.getElementById('zin').addEventListener('click',()=>{ try{ gMode==='2d'?G.zoom(G.zoom()*1.4,250):G.zoomToFit(400,100); }catch(e){} });
    document.getElementById('zout').addEventListener('click',()=>{ try{ gMode==='2d'?G.zoom(G.zoom()*0.72,250):G.zoomToFit(400,100); }catch(e){} });
    document.getElementById('zfit').addEventListener('click',()=>{ try{ G.zoomToFit(500,120); }catch(e){} });

    /* 초기 로드 */
    Promise.all([ get('/api/memories?limit=100&offset=0'), get('/api/relations').catch(()=>[]), get('/api/stats').catch(()=>null) ])
      .then(([m,r,s])=>{ all=Array.isArray(m)?m:[]; rels=Array.isArray(r)?r:[]; if(s&&s.total) statTotal=s.total; renderAll(); if(tab==='graph') initGraph(); })
      .catch(()=>{ document.getElementById('rows').innerHTML='<div class="empty"><h4>불러오지 못했어요</h4><p>서버가 켜져 있는지 확인해 주세요.</p></div>'; });

    /* ── 자동 새로고침 — 새 기억/프로젝트를 하드새로고침 없이 반영(가벼운 폴링) ── */
    let _healthSig = null, _refreshing = false;
    async function softRefresh(){
      if(_refreshing) return; _refreshing = true;
      try{
        const [m,r,s] = await Promise.all([ get('/api/memories?limit=100&offset=0'), get('/api/relations').catch(()=>[]), get('/api/stats').catch(()=>null) ]);
        all = Array.isArray(m)?m:[]; rels = Array.isArray(r)?r:[]; if(s && s.total!=null) statTotal = s.total;
        gData = null;                                   // 그래프 재조회 유도(drawGraph 자가치유)
        if(tab==='overview') renderOverview(); else renderAll();
      } catch(e){} finally { _refreshing = false; }
    }
    function _busy(){ // 사용자 작업 중이면 자동 새로고침 보류(방해 방지)
      return document.getElementById('detail').classList.contains('open')
          || document.getElementById('cmdk').classList.contains('open')
          || ((document.getElementById('q').value||'').trim() !== '');
    }
    async function pollHealth(){
      if(document.visibilityState !== 'visible') return;
      let h; try{ h = await get('/api/health'); } catch { return; }
      const sig = (h.total ?? '') + ':' + (h.lastId ?? '');
      if(_healthSig === null){ _healthSig = sig; return; }    // 최초엔 기준값만 기록
      if(sig !== _healthSig){
        if(_busy()) return;                                  // 작업 중이면 다음 기회에(기준값 유지 → 유휴 시 반영)
        _healthSig = sig; await softRefresh();
        toast('새 기억을 반영했어요','ok');
      }
    }
    setInterval(pollHealth, 45000);                           // 45초마다 가벼운 변경 확인(탭 보일 때만)
    document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') pollHealth(); });
    window.addEventListener('focus', pollHealth);             // 탭 복귀 시 즉시 확인(빠른 인식)
    document.getElementById('refreshBtn').addEventListener('click', async ()=>{
      await softRefresh();
      try{ const h=await get('/api/health'); _healthSig=(h.total??'')+':'+(h.lastId??''); }catch{}
      toast('새로고침했어요','ok');
    });
    get('/api/health').then(h=>{ _healthSig=(h.total??'')+':'+(h.lastId??''); }).catch(()=>{}); // 로드 시 기준값
  </script>
</body>
</html>
